[package]
name = "csqtt"
version = "2.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "csqtt"
path = "main.rs"

[dependencies]
aes = "0.8"
anyhow = "1.0"

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
ctr = "0.9"
dashmap = "6.1"
etherparse = "0.16"
hex = "0.4"
hkdf = "0.12"
libc = "0.2"
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
aws-lc-rs = "1.17.3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
slab = "0.4"
socket2 = "0.6"
subtle = "2.6"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "process", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
tun = "=0.8.14"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "=0.7.13"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
debug = false
incremental = false
overflow-checks = false
